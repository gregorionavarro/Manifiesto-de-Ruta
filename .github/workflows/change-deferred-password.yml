name: Change Deferred Password

on:
  push:
    paths:
      - '.github/workflows/change-deferred-password.yml'

permissions:
  contents: write

jobs:
  change-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update owner password securely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('deferred-payment-manager.html')
          s = p.read_text()
          hash_value = '21b97732ba8522a0ed6006d328653d00f0519069f8d6e3e35518947fcf807717'
          s, n1 = re.subn(r"const\s+OWNER_KEY\s*=\s*(['\"]).*?\1\s*;", f"const OWNER_KEY_HASH='{hash_value}';", s, count=1)
          old = "$('#unlockBtn').onclick=()=>{\n  if($('#ownerKey').value===OWNER_KEY){"
          new = "$('#unlockBtn').onclick=async()=>{\n  const inputBytes=new TextEncoder().encode($('#ownerKey').value);\n  const digest=await crypto.subtle.digest('SHA-256',inputBytes);\n  const inputHash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');\n  if(inputHash===OWNER_KEY_HASH){"
          n2 = s.count(old)
          s = s.replace(old, new, 1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Replacements failed: key={n1}, handler={n2}')
          p.write_text(s)
          print('Access credential updated using SHA-256 comparison')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deferred-payment-manager.html
          git diff --cached --quiet && exit 0
          git commit -m "Update deferred payment access credential"
          git push
