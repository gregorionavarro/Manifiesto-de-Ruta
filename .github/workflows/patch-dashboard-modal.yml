name: TrueMate · Quitar Dashboard del Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-modal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar tarjeta Dashboard Comercial de TrueMate Tools
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'<article class="card featured">.*?<h3>📊 Dashboard Comercial</h3>.*?</article>\s*',
              re.S,
          )
          new_s, count = pattern.subn('', s, count=1)

          if count == 0:
              print('No se encontró la tarjeta Dashboard Comercial; no se hizo cambio.')
          else:
              p.write_text(new_s, encoding='utf-8')
              print('Tarjeta Dashboard Comercial eliminada de tools.html')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet -- tools.html; then
            echo 'tools.html ya estaba sin la tarjeta Dashboard Comercial.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools.html
            git commit -m 'Remove Dashboard Comercial card from TrueMate Tools'
            git push
          fi
