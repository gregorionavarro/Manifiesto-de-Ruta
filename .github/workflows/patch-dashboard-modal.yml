name: TrueMate · Dashboard dentro del Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-modal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir Dashboard v7.2 dentro de TrueMate Tools
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools.html')
          s=p.read_text(encoding='utf-8')
          new_url='https://noisy-leaf-ece5.gregorio-navarro.workers.dev/dashboard-comercial-v7-2.html'
          old_urls=[
              'https://truemate-internal-tools.pages.dev/dashboard-comercial-v5.html',
              'https://truemate-internal-tools.pages.dev/dashboard-comercial-v6.html',
              'https://truemate-internal-tools.pages.dev/dashboard-comercial-v7.html',
          ]
          for old in old_urls:
              s=s.replace(old,new_url)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet -- tools.html; then
            echo 'tools.html ya estaba actualizado.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools.html
            git commit -m 'Open Dashboard Comercial v7.2 inside TrueMate Tools modal'
            git push
          fi
