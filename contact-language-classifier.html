<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrueMate Contact Language Classifier V1.1</title>
<style>
:root{--navy:#173b63;--blue:#225c91;--text:#162235;--muted:#6e7a8a;--line:#d6e2ef;--bg:#f5f7fb}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--text)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0f2f52,#225c91);z-index:10}
.card{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.card h1{margin:0 0 8px;font-size:24px}.card p{margin:0 0 20px;color:var(--muted);line-height:1.45}
label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;color:#536174}
input{width:100%;padding:12px 13px;border:1px solid #cfd8e2;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,92,145,.12)}
button{width:100%;margin-top:12px;border:0;background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;font-size:15px}
#error{min-height:20px;margin-top:10px;color:#a52d2d;font-size:13px;font-weight:700}
.loading{min-height:100vh;display:none;place-items:center;text-align:center;padding:24px}.loading.show{display:grid}.loading strong{display:block;font-size:20px;margin-bottom:8px}.loading span{display:block;color:var(--muted);margin-top:6px}.loading small{display:block;color:#8a4b00;margin-top:12px;max-width:680px;word-break:break-word}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>TrueMate Contact Language Classifier</h1>
    <p>Acceso restringido. Ingresa la clave para continuar.</p>
    <form id="accessForm" autocomplete="off">
      <label for="password">Clave de acceso</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Ingresa la clave" autofocus>
      <button type="submit">Ingresar</button>
      <div id="error" aria-live="polite"></div>
    </form>
  </div>
</div>
<div class="loading" id="loading"><div><strong>Cargando TrueMate Contact Language Classifier…</strong><span>Un momento por favor.</span></div></div>
<script>
const ACCESS_KEY='tm_classifier_access_v11';
const PASSWORD='Truemate2026!';
const FILES=['classifier-data-1.txt','classifier-data-2.txt','classifier-data-3.txt','classifier-data-4.txt','classifier-data-5.txt'];
const PAGE_BASE='https://gregorionavarro.github.io/Manifiesto-de-Ruta/';
const RAW_BASE='https://raw.githubusercontent.com/gregorionavarro/Manifiesto-de-Ruta/main/';
let started=false;

async function getPart(file){
  const urls=[PAGE_BASE+file+'?v=3',RAW_BASE+file+'?v=3'];
  let lastError='';
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(r.ok) return await r.text();
      lastError=`${url} → HTTP ${r.status}`;
    }catch(e){lastError=`${url} → ${e.message}`;}
  }
  throw new Error(lastError || ('No se pudo cargar '+file));
}

function loadPako(){
  return new Promise((resolve,reject)=>{
    if(window.pako) return resolve();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
    s.onload=resolve;
    s.onerror=()=>reject(new Error('No se pudo cargar el descompresor alternativo.'));
    document.head.appendChild(s);
  });
}

async function gunzip(bytes){
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('gzip');
    return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }
  await loadPako();
  return new TextDecoder().decode(window.pako.ungzip(bytes));
}

async function loadClassifier(){
  if(started) return;
  started=true;
  document.getElementById('gate').style.display='none';
  document.getElementById('loading').classList.add('show');
  try{
    const parts=[];
    for(const f of FILES) parts.push(await getPart(f));
    const b=parts.join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
    const html=await gunzip(bytes);
    if(!html || !html.includes('TrueMate Contact Language Classifier')) throw new Error('El contenido reconstruido no es válido.');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    const msg=(e && e.message) ? e.message : String(e);
    document.getElementById('loading').innerHTML='<div><strong>No se pudo cargar la herramienta.</strong><span>Actualiza la página e inténtalo nuevamente.</span><small>'+msg.replace(/[<>&]/g,'')+'</small></div>';
    console.error('Classifier load error:',e);
    started=false;
  }
}

if(sessionStorage.getItem(ACCESS_KEY)==='1') loadClassifier();

document.getElementById('accessForm').addEventListener('submit',e=>{
  e.preventDefault();
  const input=document.getElementById('password');
  const error=document.getElementById('error');
  if(input.value===PASSWORD){
    sessionStorage.setItem(ACCESS_KEY,'1');
    error.textContent='';
    loadClassifier();
  }else{
    error.textContent='Clave incorrecta.';
    input.select();
  }
});
</script>
</body>
</html>
