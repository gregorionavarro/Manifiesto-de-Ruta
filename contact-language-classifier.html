<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueMate Contact Language Classifier</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#162235}.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2f52,#225c91);padding:24px}.card{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28)}h1{font-size:24px;margin:0 0 8px}.sub{margin:0 0 20px;color:#6e7a8a;line-height:1.45}label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;color:#536174}input{width:100%;padding:12px 13px;border:1px solid #cfd8e2;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:#225c91;box-shadow:0 0 0 3px rgba(34,92,145,.12)}button{width:100%;margin-top:12px;border:0;background:#173b63;color:#fff;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;font-size:15px}.error{min-height:20px;margin-top:10px;color:#a52d2d;font-size:13px;font-weight:700}.app{display:none;width:100%;height:100%}.app iframe{border:0;width:100%;height:100%;background:#fff}body.unlocked .gate{display:none}body.unlocked .app{display:block}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="card">
    <h1>TrueMate Contact Language Classifier</h1>
    <p class="sub">Acceso restringido. Ingresa la clave para continuar.</p>
    <form id="login" autocomplete="off">
      <label for="password">Clave de acceso</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Ingresa la clave" autofocus>
      <button type="submit">Ingresar</button>
      <div class="error" id="error" aria-live="polite"></div>
    </form>
  </div>
</div>
<div class="app"><iframe src="contact-language-classifier-app.html" title="TrueMate Contact Language Classifier"></iframe></div>
<script>
(function(){
  const SESSION_KEY='truemate_classifier_v11_access';
  const PASSWORD='Truemate2026!';
  function unlock(){document.body.classList.add('unlocked');sessionStorage.setItem(SESSION_KEY,'1');}
  if(sessionStorage.getItem(SESSION_KEY)==='1') unlock();
  document.getElementById('login').addEventListener('submit',function(e){
    e.preventDefault();
    const input=document.getElementById('password');
    const error=document.getElementById('error');
    if(input.value===PASSWORD){error.textContent='';unlock();}
    else{error.textContent='Clave incorrecta.';input.select();}
  });
})();
</script>
</body>
</html>
